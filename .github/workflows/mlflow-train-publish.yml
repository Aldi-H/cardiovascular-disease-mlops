name: MLflow Retrain and Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrain-and-publish:
    name: Retrain, archive artifacts, and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_S3_ENDPOINT_URL: ${{ secrets.MLFLOW_S3_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      B2_DATA_OBJECT_KEY: datasets/cardiovascular-disease.csv
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run automated tests
        run: python -m pytest -q tests

      - name: Validate required secrets
        shell: bash
        run: |
          required=(
            MLFLOW_TRACKING_URI
            MLFLOW_TRACKING_USERNAME
            MLFLOW_TRACKING_PASSWORD
            MLFLOW_S3_ENDPOINT_URL
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            AWS_DEFAULT_REGION
            B2_BUCKET_NAME
            DOCKERHUB_USERNAME
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Download training data through the MLflow Project
        run: mlflow run ./MLProject -e download_data --env-manager=local

      - name: Retrain models through the MLflow Project
        run: mlflow run ./MLProject -e train --env-manager=local

      - name: Export best B2-backed run for GitHub artifacts and Docker
        run: python src/export_best_run.py --output-dir ci_artifacts

      - name: Store model and evaluation artifacts in GitHub
        uses: actions/upload-artifact@v4
        with:
          name: cardiovascular-model-and-evaluation
          path: ci_artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Set selected MLflow model URI
        shell: bash
        run: echo "MODEL_URI=$(cat ci_artifacts/model_uri.txt)" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push MLflow model image
        shell: bash
        run: |
          dockerhub_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          if [[ -z "$dockerhub_username" ]]; then
            echo "DOCKERHUB_USERNAME kosong setelah whitespace dibersihkan."
            exit 1
          fi
          image="${dockerhub_username}/cardiovascular-disease-mlflow:${GITHUB_SHA:0:12}"
          mlflow models build-docker \
            --model-uri "$MODEL_URI" \
            --name "$image" \
            --enable-mlserver
          docker push "$image"

      - name: Build and push FastAPI serving image
        shell: bash
        run: |
          dockerhub_username="$(printf '%s' "$DOCKERHUB_USERNAME" | tr -d '[:space:]')"
          if [[ -z "$dockerhub_username" ]]; then
            echo "DOCKERHUB_USERNAME kosong setelah whitespace dibersihkan."
            exit 1
          fi
          image="${dockerhub_username}/cardiovascular-disease-api:${GITHUB_SHA:0:12}"
          docker build --file Dockerfile --tag "$image" .
          docker push "$image"

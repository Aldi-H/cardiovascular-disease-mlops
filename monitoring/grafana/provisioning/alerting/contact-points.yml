apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord Alert Channel
    receivers:
      - uid: discord-alert-channel
        type: discord
        disableResolveMessage: false
        settings:
          url: $GRAFANA_DISCORD_WEBHOOK_URL
          use_discord_username: false
          title: '{{ template "default.title" . }}'
          message: '{{ template "default.message" . }}'
